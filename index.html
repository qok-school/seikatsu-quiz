<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ジュニアアスリート 生活習慣クイズ｜食事・栄養</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <p class="app-category">食事・栄養</p>
      <h1 class="app-title">生活習慣学習クイズ</h1>
    </header>

    <!-- スタート画面 -->
    <section id="start-screen" class="card screen">
      <h2 class="screen-title">練習の質を上げる食事クイズ</h2>
      <p class="lead">
        朝食・昼食・練習前・練習後・夕食・水分補給の6テーマから
        全<span id="total-count">0</span>問。<br>
        4つの選択肢から正しいものを1つ選ぼう。
      </p>
      <button id="start-btn" class="btn btn-primary">スタート</button>
    </section>

    <!-- クイズ画面 -->
    <section id="quiz-screen" class="card screen" hidden>
      <div class="progress-row">
        <span id="progress-label" class="progress-label">第1問 / 全10問</span>
        <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
      </div>

      <p id="question-topic" class="question-topic">テーマ</p>
      <h2 id="question-text" class="question-text">問題文</h2>

      <div id="choices" class="choices"></div>

      <div id="feedback" class="feedback" hidden>
        <p id="feedback-mark" class="feedback-mark"></p>
        <p id="feedback-text" class="feedback-text"></p>
      </div>

      <button id="next-btn" class="btn btn-primary" hidden>次の問題へ</button>
    </section>

    <!-- 結果画面 -->
    <section id="result-screen" class="card screen" hidden>
      <h2 class="screen-title">結果</h2>
      <p class="score-line">
        <span id="score-num">0</span> / <span id="score-total">0</span> 問 正解
      </p>
      <p id="score-comment" class="score-comment"></p>
      <div id="review" class="review"></div>
      <button id="retry-btn" class="btn btn-primary">もう一度挑戦する</button>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
